# Copy this file as config.toml (not under version control) to change the paths.
# The TAPE_DATA_DIR and TAPE_USER_DATA_DIR environment variables take precedence.
# Relative paths are resolved from the repository root.

[paths]
# Folder where the capture pipeline leaves the CSV files. The dashboard only reads it.
data_dir = "../tape_data"

# The user's manual edits and positions. Not under version control.
user_data_dir = "user_data"
