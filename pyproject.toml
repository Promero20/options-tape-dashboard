[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tape-dashboard"
version = "0.1.0"
description = "Local Python dashboard that rebuilds, classifies and charts large options trades from daily Time & Sales captures"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "dash>=4.4,<5",
    "dash-ag-grid>=35.3,<36",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
# `pipeline/` contiene el script de nivel 3 que también ejecuta el pipeline: vive
# en la raíz para que se vea como lo que es, un script autónomo.
package-dir = {"" = "src", "pipeline" = "pipeline"}
packages = [
    "pipeline",
    "tape_dashboard",
    "tape_dashboard.app",
    "tape_dashboard.app.tabs",
    "tape_dashboard.app.tabs.incomplete",
    "tape_dashboard.app.tabs.operations",
    "tape_dashboard.app.tabs.positions",
    "tape_dashboard.data",
    "tape_dashboard.edits",
    "tape_dashboard.rules",
]

[tool.setuptools.package-data]
"tape_dashboard.app" = ["assets/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
markers = [
    "real_data: necesita la carpeta de datos (se omite si no existe)",
]
